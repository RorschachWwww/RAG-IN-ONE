worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream embedding_backend {
        least_conn;

        # Add or remove backend instances here.
        # These match the default ports created by run_bge_m3_multi_gpu.sh.
        server 127.0.0.1:18080 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:18081 max_fails=3 fail_timeout=30s;

        keepalive 64;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 16m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        location = /healthz {
            access_log off;
            proxy_pass http://embedding_backend/healthz;
        }

        location = /readyz {
            access_log off;
            proxy_pass http://embedding_backend/readyz;
        }

        location / {
            proxy_pass http://embedding_backend;
        }
    }
}
